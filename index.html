<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Trình xem mô hình 3D khuôn viên THPT Lê Hồng Phong với Three.js."
    />
    <title>THPT Lê Hồng Phong 3D Viewer</title>
  </head>
  <body>
    <div id="app">
      <main class="viewer-shell">
        <section
          id="viewer-stage"
          class="viewer-stage"
          aria-label="Trình xem mô hình 3D THPT Lê Hồng Phong"
        >
          <canvas
            id="viewer-canvas"
            aria-label="Canvas hiển thị mô hình 3D trường THPT Lê Hồng Phong"
          ></canvas>

          <div class="viewer-overlay">
            <header class="panel topbar">
              <div class="brand-lockup">
                <p class="brand-kicker" id="school-subtitle"></p>
                <p class="brand-name" id="school-title"></p>
              </div>

              <nav class="topnav" aria-label="Điều hướng giao diện">
                <a class="nav-link" href="#heritage">Di sản</a>
                <a class="nav-link" href="#viewer-details">Khám phá</a>
                <a class="nav-link" href="#controls">Điều khiển</a>
              </nav>

              <div
                style="
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  gap: 1rem;
                "
              >
                <p
                  id="reset-view-button"
                  class="topbar-badge"
                  type="button"
                ></p>
                <p class="topbar-badge">Est. 1927 · Saigon</p>
              </div>
            </header>

            <div class="overlay-grid">
              <section class="panel hints-card">
                <p class="panel-title">Cách tương tác</p>
                <ul id="instruction-list" class="hints-list"></ul>
              </section>

              <section
                id="controls"
                class="panel controls-card"
                aria-live="polite"
              >
                <div class="status-line">
                  <p class="panel-title" id="status-label"></p>
                  <span id="progress-value" class="status-value">0%</span>
                </div>

                <div id="progress-shell" class="progress-shell">
                  <div
                    class="progress-track"
                    role="progressbar"
                    aria-label="Tiến trình tải mô hình"
                    aria-valuemin="0"
                    aria-valuemax="100"
                    aria-valuenow="0"
                  >
                    <div id="progress-fill" class="progress-fill"></div>
                  </div>
                </div>

                <p id="status-message" class="status-message"></p>
                <p id="error-banner" class="error-banner" hidden></p>

                <div class="button-row">
                  <button
                    id="toggle-auto-rotate-button"
                    class="action-button action-button--ghost"
                    type="button"
                  ></button>
                </div>
              </section>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
